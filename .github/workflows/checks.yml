name: checks

# Lint and tests only. LibreOuya is a set of bash scripts, so there is nothing
# to build and no release job.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck devscripts mksh jq

      - name: Lint PC-side scripts
        run: shellcheck -x libreouya tests/run.sh tests/fakebin/adb tests/fakebin/fastboot

      - name: Lint device-side scripts (they run under the OUYA's mksh)
        run: |
          shellcheck -s sh device/lib.sh device/dns.sh
          checkbashisms device/lib.sh device/dns.sh
          mksh -n device/lib.sh
          mksh -n device/dns.sh

      - name: Tests
        # Called through bash because files uploaded through the web UI lose the exec bit.
        run: bash tests/run.sh
